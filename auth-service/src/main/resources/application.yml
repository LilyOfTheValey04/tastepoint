spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8081

eureka:
  client:
    enabled: false
    # service-url:
    #  defaultZone: http://localhost:8761/eureka

jwt:
      secret: ${JWT_SECRET}
      expiration: 3600000